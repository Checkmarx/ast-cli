project_name: ast-cli

release:
  prerelease: true
  name_template: 'Checkmarx One CLI {{.Version}}'
  disable: true

before:
  hooks:
    # embed the real version into the Windows exe (cmd/rsrc_windows_*.syso is gitignored)
    - go tool go-winres make --in cmd/winres/winres.json --out cmd/rsrc --arch amd64,386,arm64 --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }} --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  - main: ./cmd
    env:
      - CGO_ENABLED=0
    binary: cx
    id: cx
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: linux
        goarm: 7
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X github.com/checkmarx/ast-cli/internal/params.Version={{.Version}}
    hooks:
      post:
        # fail the build before archives and S3 upload if a Windows exe lacks the version info (other targets are skipped)
        - cmd: go run .github/scripts/verify-winres.go {{ .Major }}.{{ .Minor }}.{{ .Patch }} {{ .Path }}
          output: true
    # hooks:
    #   post:
    #     - cmd: bash .github/scripts/signing_win.sh dist/cx_windows_amd64_v1/cx.exe {{.Os}}
    #       output: true
    #       env:
    #         - SIGNING_REMOTE_SSH_USER={{ .Env.SIGNING_REMOTE_SSH_USER }}
    #         - SIGNING_REMOTE_SSH_HOST={{ .Env.SIGNING_REMOTE_SSH_HOST }}
    #         - SIGNING_HSM_CREDS={{ .Env.SIGNING_HSM_CREDS }}
    #         - SIGNING_REMOTE_SSH_PRIVATE_KEY={{ .Env.SIGNING_REMOTE_SSH_PRIVATE_KEY }}

  - main: ./cmd
    env:
      - CGO_ENABLED=0
    binary: cx
    id: cx-mac-universal
    goos:
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    ldflags:
      - -s
      - -w
      - -X github.com/checkmarx/ast-cli/internal/params.Version={{.Version}}

archives:
  - id: cx
    builds:
      - cx
    format_overrides:
      - goos: windows
        format: zip
    replacements:
      amd64: x64
      386: x32
    files:
      - LICENSE
  - id: cx-mac-universal
    builds:
      - cx-mac-universal
    files:
      - LICENSE
      - ./dist/cx-mac-universal_darwin_all/cx.dmg
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_x64"

universal_binaries:
  - id: cx-mac-universal
    replace: true
    name_template: "cx"
    hooks:
      post: bash -c 'envsubst < gonMac.hcl > /tmp/gonMac.hcl && gon /tmp/gonMac.hcl || (echo "gon failed, force-detaching DMG volume..."; hdiutil detach /Volumes/cx -force 2>/dev/null || true; gon /tmp/gonMac.hcl)'

blobs:
  - provider: s3
    region: "{{ .Env.S3_BUCKET_REGION }}"
    bucket: "{{ .Env.S3_BUCKET_NAME }}"
    folder: "CxOne/CLI/{{ .Tag }}"
    ids:
      - cx
      - cx-mac-universal
    disable: true

changelog:
  use: github-native
 
